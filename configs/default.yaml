# classroom-locator 전역 설정
# 2026-09-17: OCR 완전 배제 결정 -> 이후 재도입. room2/room4는 YOLO가
# 이미지만으로 직접 분류하는 방식을 그대로 쓰되(test_sample 평가에서 OCR
# 전체 대체 방식보다 훨씬 안정적임을 확인함 - docs/setup_log.md 14~15번
# 참고), room3 정정용으로만 좁게 OCR을 다시 들여왔음(같은 날 저녁 - 메인
# 화면에서도 room3/로고가 안 보인다는 요청). 표지판 글자는 근접 판정 시
# classroom_locator.landmark_locator.ocr_verify.OcrVerifier(build_verifier/
# read_digit)를 pipeline/core.py와 pipeline/grid_tracker.py가 공용으로 씀.
#
# 2모델 구성(seojiwoo/core 최종 방식으로 이식, 2026-09-18): logo까지 합쳐
# 6클래스로 재학습하면 표지판(2_class/4_class) 원거리 탐지 정확도가 무너지는
# 문제가 있어(seojiwoo/README.md "자주 막히는 곳" 참고), 표지판·문 전용
# landmark_best.pt(5클래스)와 로고 전용 logo_best.pt로 다시 분리함.
# detection/yolo_detector.py(YoloDetector)가 logo_weights를 받으면 로고는
# logo_weights 모델에서만, 나머지 클래스는 weights 모델에서만 가져온다
# (classroom_locator.landmark_locator.locator.Locator.detect()와 동일 로직).
# 클래스 이름은 여전히 "2_class"/"4_class" 그대로라서 class_name_map으로
# room2/room4로 바꿔치기함.

detector:
  backend: ultralytics        # "ultralytics" | "yolov5"
  weights: models/yolo/landmark_best.pt
  logo_weights: models/yolo/logo_best.pt
  conf_threshold: 0.5
  class_name_map:
    "2_class": "room2"
    "4_class": "room4"
  # room2/room4(YOLO 직접분류, OCR로 room3 정정) + front_door/rear_door/logo.
  # water_dispenser(정수기)는 2026-09-17부터 인식 대상에서 제외함 (사용자 요청).
  target_classes: ["room2", "room4", "front_door", "rear_door", "logo"]

# seojiwoo/core 최종 판정값 (2026-09-18 이식). classroom_locator.landmark_locator.
# Locator를 직접 쓰는 경로(pipeline/grid_tracker.py의 LandmarkGridPositionTracker,
# scripts/run_landmark_demo.py)가 이 값을 읽는다 - pipeline/core.py의
# LocatorPipeline(YoloDetector 직접분류, 거리·투표 없음)에는 해당 안 됨.
# ocr_confirm_frames(=2)는 Locator 안에 고정값이라 여기 없음.
locator:
  min_votes: 4       # 최근 window(5)프레임 중 몇 표 이상이어야 확정할지
  sign_conf: 0.35     # 표지판(2_class/4_class) confidence - OCR 검증과 함께 쓰므로 낮게
  conf: 0.5           # 그 외 클래스(문/로고) confidence
  near_m: 3.0         # 이 거리(m) 이하면 근접(near) 판정
  f_norm: 0.85        # 거리 추정(핀홀) 보정 계수

localization:
  locations_file: configs/locations.yaml

pipeline:
  # 배치 모드에서 처리할 이미지 확장자
  image_extensions: [".jpg", ".jpeg", ".png"]
  # 결과 저장 위치
  output_dir: outputs/results
  save_annotated_image: true

realtime:
  camera_index: 0
  frame_width: 1280
  frame_height: 720
  # N 프레임마다 한 번씩만 탐지/OCR 수행 (성능을 위해)
  process_every_n_frames: 5
  # 위치가 바뀔 때마다 그 순간 화면을 outputs/results/realtime_snapshots/에 저장.
  # 실행할 때 --snapshot / --no-snapshot 으로도 덮어쓸 수 있음 (기본 꺼짐).
  save_snapshots: false
  # 격자 지도(현재 위치) 창 표시 여부. --grid-map / --no-grid-map 으로도 덮어쓸 수 있음 (기본 꺼짐).
  show_grid_map: false

logging:
  level: INFO
  log_dir: outputs/logs
