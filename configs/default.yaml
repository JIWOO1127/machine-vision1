# classroom-locator 전역 설정
# 2026-09-17: OCR 완전 배제 결정. room2/room4까지 YOLO가 이미지만으로 직접
# 분류하는 방식으로 전환 (test_sample 평가에서 OCR 방식보다 훨씬 안정적임을
# 확인함 - docs/setup_log.md 14~15번 참고). ocr 섹션은 target_classes에
# "sign"이 없으면 자동으로 초기화 자체를 건너뜀 (core.py 참고).
#
# final_best.pt로 교체함 (best_yolo_only.pt보다 test_sample 평가에서 더
# 좋았음 - Macro F1 0.850 vs 0.821, docs/setup_log.md 15번 참고). 이 모델은
# 클래스 이름이 "2_class"/"4_class" 그대로라서 class_name_map으로
# room2/room4로 바꿔치기함.

detector:
  backend: ultralytics        # "ultralytics" | "yolov5"
  weights: models/yolo/final_best.pt
  conf_threshold: 0.5
  class_name_map:
    "2_class": "room2"
    "3_class": "room3"       # YOLO 직접 클래스가 없으면 OCR 결과가 이 논리 클래스를 만듦
    "4_class": "room4"
    "logo": "logo"            # logo 포함 모델(final_best_v2 등)을 쓸 때 사용
  # final_best.pt 실제 클래스: 2/4 표지판, 앞/뒷문, 정수기, logo.
  target_classes: ["room2", "room4", "front_door", "rear_door", "water_dispenser", "logo"]

# navigator.py와 ocr_verify.py의 공통 클래스 계약.
# sign은 별도 YOLO 클래스가 아니라 2/3/4 표지판을 하나로 취급하는 논리 클래스다.
# final_best.pt는 logo를 직접 탐지한다. 3_class는 OCR이 숫자 3을 읽었을 때만
# 실제 탐지 입력으로 들어오는 논리 클래스다.
navigation:
  class_groups:
    sign: ["2_class", "3_class", "4_class"]
  optional_detector_classes: ["3_class"]
  route:
    - key: find_logo
      target: logo
      near_m: null
      search_hint: "뒤로 천천히 도세요. 로고를 찾습니다"
    - key: reach_wall
      target: logo
      near_m: 1.2
      search_hint: "로고를 향해 직진하세요"
      on_reach: "벽입니다. 왼쪽으로 돌아 벽을 따라 이동하세요"
    - key: room4
      target: sign
      expected_class: "4_class"
      near_m: 3.0
      search_hint: "왼쪽 벽을 따라 이동하세요. 4강의실을 찾습니다"
      on_reach: "4강의실 앞입니다. 계속 직진하세요"
    - key: room3
      target: sign
      expected_class: "3_class"
      near_m: 3.0
      search_hint: "계속 벽을 따라 이동하세요. 3강의실을 지납니다"
      on_reach: "3강의실 앞입니다. 계속 직진하세요"
    - key: room2
      target: sign
      expected_class: "2_class"
      near_m: 3.0
      search_hint: "계속 벽을 따라 이동하세요. 2강의실을 찾습니다"
      on_reach: "2강의실 앞입니다. 왼쪽으로 돌아 뒷문을 찾으세요"
    - key: rear_door
      target: rear_door
      near_m: 3.0
      search_hint: "왼쪽으로 돌아 뒷문을 찾으세요"
      on_reach: "뒷문입니다. 목적지에 도착했습니다"

ocr:
  backend: easyocr             # "easyocr" | "paddleocr" | "tesseract"
  lang: ["ko", "en"]
  min_confidence: 0.4
  sign_classes: ["2_class", "3_class", "4_class"]
  reject_room_types: ["회의실", "meeting"]

localization:
  locations_file: configs/locations.yaml
  # OCR 텍스트와 위치 이름을 비교할 때 허용할 최소 유사도 (0~100, rapidfuzz 기준)
  # 실제 영상에서 OCR이 "실"을 "신"으로 오인식하는 등 노이즈가 있어 70은 너무 엄격해서 55로 낮춤
  match_threshold: 55

pipeline:
  # 배치 모드에서 처리할 이미지 확장자
  image_extensions: [".jpg", ".jpeg", ".png"]
  # 결과 저장 위치
  output_dir: outputs/results
  save_annotated_image: true

realtime:
  camera_index: 0
  frame_width: 1280
  frame_height: 720
  # N 프레임마다 한 번씩만 탐지/OCR 수행 (성능을 위해)
  process_every_n_frames: 5
  # 위치가 바뀔 때마다 그 순간 화면을 outputs/results/realtime_snapshots/에 저장.
  # 실행할 때 --snapshot / --no-snapshot 으로도 덮어쓸 수 있음.
  save_snapshots: true
  # 격자 지도(현재 위치) 창 표시 여부. --grid-map / --no-grid-map 으로도 덮어쓸 수 있음.
  show_grid_map: true

logging:
  level: INFO
  log_dir: outputs/logs
