# final_best.pt (클래스명이 2_class/4_class 그대로인 YOLO 단독 모델) 테스트용 설정.
# --raw-detector 모드(scripts/evaluate_test_sample.py)와 함께 써서, OCR/locations.yaml
# 매칭 없이 YOLO 탐지 결과를 바로 평가합니다.

detector:
  backend: ultralytics
  weights: models/yolo/final_best.pt
  conf_threshold: 0.5
  target_classes: ["2_class", "4_class", "front_door", "rear_door", "water_dispenser", "logo"]
  # 3_class는 OCR이 숫자 3을 읽었을 때만 만들어지는 논리 클래스다.
  class_name_map:
    "2_class": "room2"
    "3_class": "room3"
    "4_class": "room4"
    "logo": "logo"

navigation:
  class_groups:
    sign: ["2_class", "3_class", "4_class"]
  optional_detector_classes: ["3_class"]

ocr:
  backend: easyocr
  lang: ["ko", "en"]
  min_confidence: 0.4
  sign_classes: ["2_class", "3_class", "4_class"]
  reject_room_types: ["회의실", "meeting"]

localization:
  locations_file: configs/locations.yaml
  match_threshold: 55

pipeline:
  image_extensions: [".jpg", ".jpeg", ".png"]
  output_dir: outputs/results
  save_annotated_image: true

realtime:
  camera_index: 0
  frame_width: 1280
  frame_height: 720
  process_every_n_frames: 5
  save_snapshots: true

logging:
  level: INFO
  log_dir: outputs/logs
