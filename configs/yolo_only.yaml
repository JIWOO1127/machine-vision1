# OCR을 잠깐 끄고 YOLO 직접분류만으로 성능을 비교해보기 위한 실험용 설정.
# room2/room4를 "sign" 하나로 합치지 않고 YOLO가 직접 분류하도록 학습한
# 모델(models/yolo/best_yolo_only.pt)을 씁니다. class_name이 "sign"이 아니면
# core.py가 OCR을 거치지 않고 바로 locations.yaml을 조회하므로, 이 설정만
# 바꾸면 코드 수정 없이 OCR이 자동으로 빠집니다.
#
# 주의: 이 실험용 데이터셋(data/dataset_yolo_only)에는 room3 라벨이 없어서
# room3는 이 모델로 학습/평가가 안 됩니다.

detector:
  backend: ultralytics
  weights: models/yolo/best_yolo_only.pt
  conf_threshold: 0.5
  target_classes: ["room2", "room4", "front_door", "rear_door", "water_dispenser"]

ocr:
  backend: easyocr
  lang: ["ko", "en"]
  min_confidence: 0.4

localization:
  locations_file: configs/locations.yaml
  match_threshold: 55

pipeline:
  image_extensions: [".jpg", ".jpeg", ".png"]
  output_dir: outputs/results
  save_annotated_image: true

realtime:
  camera_index: 0
  frame_width: 1280
  frame_height: 720
  process_every_n_frames: 5
  save_snapshots: true

logging:
  level: INFO
  log_dir: outputs/logs
